# ══════════════════════════════════════════════════════════════════════════════
# НАСТАВНИК v1 -- пороги эвристик (Task PROGR-6, spec_progress.md §7, §12 п.7)
# ══════════════════════════════════════════════════════════════════════════════
#
# Пороговые значения sanity-эвристик «Наставника» -- НЕ хардкод в коде,
# а конфигурация «тем же паттерном, что уже хранит IQR-множитель 1.5 и
# пороги D05 в спецификации Моделирования» (§12 п.7 дословно):
# калибруемые константы живут отдельно от кода.
#
# Сами значения -- стартовые дефолты §7.2 (0.2 / 0.3 / окно 10 минут /
# 3 стратегии) и «требуют калибровки на реальном использовании
# платформы»; от инфраструктуры не зависят. Читатель --
# app/core/mentor_rules.py::load_mentor_config (fail-closed на импорте,
# паттерн EDA-JSON §12 п.2: битый/отсутствующий файл -- ImportError,
# Наставник не стартует с частичной картиной порогов).
#
# Формат согласован с правилами каталога rules/*.yaml (modeling.yaml):
# секции по классам правил, плоские скаляры, комментарии -- часть контракта.

metadata:
  version: "1.0"
  spec: "spec_progress.md §7.2, §12 п.7"
  task: "PROGR-6"
  description: >-
    Пороги sanity-эвристик «Наставника» v1: правила реакции на
    preview-исход Мастера (§7.2) и правило «метаний» по истории трассы
    (on_demand_with_history). Калибруются по реальному использованию.

# ── Правила §7.2 (trigger="on_correction_result"): реакция на preview ──
sanity:
  # «Переглаживание»: стандартное отклонение после исправления схлопнулось
  # до доли std_collapse_factor от исходного (0.2 == «более чем в 5 раз»).
  over_aggressive:
    std_collapse_factor: 0.2

  # «Потеря данных»: drop_rows удаляет долю строк выше max_removed_share.
  excessive_data_loss:
    max_removed_share: 0.3

# ── Правило «мечется» (trigger="on_demand_with_history"): история трассы ──
history:
  thrashing:
    # Окно (минуты), внутри которого ищутся preview-попытки узла.
    window_minutes: 10
    # Сколько РАЗНЫХ стратегий подряд без единого correction_applied
    # считаются паттерном «аналитик пробует всё подряд».
    distinct_strategies: 3
