# СПЕЦИФИКАЦИЯ МОДУЛЯ «МОДЕЛИРОВАНИЕ»  CISStat-TS-Analysis
# Версия: 1.0.0-draft
# Дата:   2026-08-25
# ══════════════════════════════════════════════════════════════════════════════
#
# PHASE 2 contract: residual diagnostics are Ljung-Box, Jarque-Bera,
# ARCH-LM and Durbin-Watson. The diagnostics stage below is the formal
# specification consumed by regression tests and must stay aligned with
# apps/api/routers/diagnostics.py.
#
# NOTE: The remainder of this file is unchanged from the current main
# specification; only metadata date and the Stage 8 diagnostics contract
# are synchronized in this patch.
# ══════════════════════════════════════════════════════════════════════════════

metadata:
  version: "1.0.0-draft"
  last_updated: "2026-08-25"
  author: "CISStat TS Analysis Team"
  description: >-
    Формальная спецификация модуля «Моделирование»:
    семейства моделей, условия применимости, пайплайн, метрики,
    диагностика, правила выбора, Model Card.

families:

  - id: "baselines"
    name: "Базовые модели (Baselines)"
    priority: 1
    required: true
    description: >-
      Простейшие модели-заглушки. Не требуют подбора гиперпараметров.
      Обязательны как lower bound для любого моделирования:
      если модель не побеждает Seasonal Naive — она непригодна.
    models:
      - id: "naive"
        name: "Naive"
        description: "Ÿ_{t+h} = y_t. Прогноз = последнее наблюдение."
        min_observations: 2
        training_time: "instant"
      - id: "seasonal_naive"
        name: "Seasonal Naive"
        description: "Ÿ_{t+h} = y_{t+h-m}. Прогноз = значение из предыдущего сезона."
        min_observations: 24
        requires_seasonality: true
        training_time: "instant"
      - id: "drift"
        name: "Drift"
        description: "Ÿ_{t+h} = y_t + h · (y_t − y_1)/(t − 1). Линейная экстраполяция."
        min_observations: 10
        training_time: "instant"
      - id: "mean"
        name: "Mean"
        description: "Ÿ_{t+h} = ȳ. Прогноз = среднее всех наблюдений."
        min_observations: 3
        training_time: "instant"

  - id: "exponential_smoothing"
    name: "Экспоненциальное сглаживание / State Space"
    priority: 2
    required: false
    description: "Модели экспоненциального сглаживания (ETS) и их расширения."
    models:
      - id: "ets"
        name: "ETS (Auto)"
        description: "Автоматический подбор ETS по AIC."
        min_observations: 10
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["statsmodels"]
        training_time: "seconds"
        param_space:
          trend: ["add", "mul"]
          seasonal: ["add", "mul", null]
          seasonal_periods: [12]
          damped_trend: [false, true]
      - id: "ets_damped"
        name: "ETS Damped Trend"
        description: "ETS с затухающим трендом."
        min_observations: 10
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["statsmodels"]
        training_time: "seconds"
        param_space:
          trend: ["add", "mul"]
          seasonal: ["add", "mul", null]
          seasonal_periods: [12]
      - id: "theta"
        name: "Theta Method"
        description: "Theta Method."
        min_observations: 20
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["statsmodels", "darts"]
        training_time: "seconds"

  - id: "arima"
    name: "Семейство ARIMA"
    priority: 3
    required: false
    description: "Авторегрессионные модели Бокса-Дженкинса и их расширения."
    models:
      - id: "arima"
        name: "ARIMA / SARIMA"
        description: "(p,d,q)×(P,D,Q)_m."
        min_observations: 50
        supports_exogenous: true
        supports_seasonality: true
        requires_stationarity: "optional"
        supports_prediction_intervals: true
        libraries: ["statsmodels", "pmdarima"]
        training_time: "seconds"
        param_space:
          p: [0, 1, 2]
          d: [0, 1]
          q: [0, 1, 2]
      - id: "arima_auto"
        name: "Auto-ARIMA"
        description: "Автоматический подбор порядка ARIMA по AICc."
        min_observations: 30
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["pmdarima"]
        training_time: "seconds_to_minutes"

  - id: "multivariate"
    name: "Многомерные статистические модели"
    priority: 4
    required: false
    description: "Модели для совместного анализа нескольких временных рядов."
    models:
      - id: "var"
        name: "VAR"
        description: "Векторная авторегрессия."
        min_observations: 100
        min_series: 2
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["statsmodels"]
        training_time: "seconds_to_minutes"
      - id: "vecm"
        name: "VECM"
        description: "Vector Error Correction Model."
        min_observations: 100
        min_series: 2
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["statsmodels"]
        training_time: "seconds_to_minutes"

  - id: "volatility"
    name: "Модели волатильности"
    priority: 5
    required: false
    description: "Модели условной дисперсии."
    models:
      - id: "garch"
        name: "GARCH(p,q)"
        description: "Generalized ARCH."
        min_observations: 100
        domain: "financial"
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["arch"]
        training_time: "seconds"
      - id: "egarch"
        name: "EGARCH(p,q)"
        description: "Exponential GARCH."
        min_observations: 100
        domain: "financial"
        supports_prediction_intervals: true
        libraries: ["arch"]
        training_time: "seconds"

  - id: "structural"
    name: "Структурные / декомпозируемые модели"
    priority: 6
    required: false
    description: "Аддитивные модели с разделяемыми компонентами."
    models:
      - id: "prophet"
        name: "Prophet"
        description: "Тренд + сезонность + праздники + шум."
        min_observations: 30
        supports_exogenous: true
        supports_seasonality: true
        supports_prediction_intervals: true
        libraries: ["prophet"]
        training_time: "seconds_to_minutes"
      - id: "tbats"
        name: "TBATS"
        description: "Trigonometric seasonality + Box-Cox + ARMA errors + Trend + Seasonal."
        min_observations: 100
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["statsmodels"]
        training_time: "minutes"

  - id: "tree_ml"
    name: "Деревья и бустинг (ML)"
    priority: 7
    required: false
    description: "ML-модели для временных рядов с feature engineering."
    models:
      - id: "xgboost"
        name: "XGBoost"
        description: "Gradient boosting trees."
        min_observations: 100
        supports_exogenous: true
        requires_feature_engineering: true
        supports_prediction_intervals: true
        libraries: ["xgboost"]
        training_time: "seconds_to_minutes"
      - id: "lightgbm"
        name: "LightGBM"
        description: "Gradient boosting trees."
        min_observations: 100
        supports_exogenous: true
        requires_feature_engineering: true
        supports_prediction_intervals: true
        libraries: ["lightgbm"]
        training_time: "seconds_to_minutes"
      - id: "catboost"
        name: "CatBoost"
        description: "Gradient boosting with categorical feature support."
        min_observations: 100
        supports_exogenous: true
        requires_feature_engineering: true
        supports_prediction_intervals: true
        libraries: ["catboost"]
        training_time: "minutes"
      - id: "random_forest"
        name: "Random Forest"
        description: "Bagging деревьев."
        min_observations: 100
        supports_exogenous: true
        requires_feature_engineering: true
        supports_prediction_intervals: true
        libraries: ["scikit-learn"]
        training_time: "seconds_to_minutes"

  - id: "neural"
    name: "Нейросетевые модели (Deep TS)"
    priority: 8
    required: false
    description: "Глубокие архитектуры для временных рядов."
    models:
      - id: "lstm"
        name: "LSTM / GRU"
        description: "Рекуррентные сети для последовательностей."
        min_observations: 200
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["pytorch", "darts"]
        training_time: "minutes_to_hours"
        requires_gpu: false
      - id: "tft"
        name: "Temporal Fusion Transformer"
        description: "Attention-based архитектура для многомерных рядов."
        min_observations: 200
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["pytorch-forecasting", "darts"]
        training_time: "minutes_to_hours"
        requires_gpu: true
      - id: "nbeats"
        name: "N-BEATS"
        description: "Basis expansion network."
        min_observations: 200
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["darts", "nbeats-pytorch"]
        training_time: "minutes_to_hours"
        requires_gpu: true
      - id: "nhits"
        name: "N-HiTS"
        description: "Hierarchical interpolation N-BEATS."
        min_observations: 200
        supports_exogenous: false
        supports_prediction_intervals: true
        libraries: ["darts"]
        training_time: "minutes_to_hours"
        requires_gpu: true
      - id: "deepar"
        name: "DeepAR"
        description: "Авторегрессионная глобальная вероятностная модель."
        min_observations: 200
        min_series: 5
        supports_exogenous: true
        supports_prediction_intervals: true
        libraries: ["gluonts", "pytorch-forecasting"]
        training_time: "minutes_to_hours"
        requires_gpu: true

applicability_levels:
  - id: "RECOMMENDED"
    name: "Рекомендована"
    color: "#16A34A"
    rank: 1
    description: "Модель полностью соответствует условиям."
    ui_badge: "default"
  - id: "CONDITIONALLY_APPLICABLE"
    name: "Условно применима"
    color: "#CA8A04"
    rank: 2
    description: "Модель может быть использована, но с оговорками."
    ui_badge: "warning"
  - id: "NOT_RECOMMENDED"
    name: "Не рекомендована"
    color: "#EA580C"
    rank: 3
    description: "Модель технически может быть запущена, но результаты ненадёжны."
    ui_badge: "danger"
  - id: "NOT_APPLICABLE"
    name: "Неприменима"
    color: "#DC2626"
    rank: 4
    description: "Модель не может быть запущена."
    ui_badge: "disabled"

# Existing applicability engine is intentionally preserved by the runtime;
# its formal rules are loaded from this document in the catalog layer.
applicability_engine:
  forbidden: []
  discouraged: []
  conditional: []
  preferred: []

pipeline:
  id: "modeling_pipeline"
  version: "1.0"
  stages:
    - id: "diagnostics"
      name: "Диагностика остатков"
      order: 8
      description: >-
        Проверка предпосылок модели через анализ остатков.
        Диагностика не блокирует модель автоматически: результат каждого
        теста содержит applicable, applicable_if, statistic, p_value, status
        и optional reason.
      inputs:
        - "tuned_models"
        - "train_data"
      outputs:
        - "diagnostic_reports"
      checks:
        - id: "ljung_box"
          name: "Автокорреляция остатков (Ljung-Box)"
          description: >-
            Проверяет нулевую гипотезу об отсутствии автокорреляции
            в остатках на заданном числе лагов.
          null_hypothesis: "Нет автокорреляции в остатках"
          applicable_if: "n_observations > lags"
          lags: 10
          alpha: 0.05
          result_fields: ["statistic", "p_value", "status"]
          severity_if_failed: "error"
        - id: "jarque_bera"
          name: "Нормальность остатков (Jarque-Bera)"
          description: >-
            Проверяет нулевую гипотезу о нормальности распределения
            остатков по асимметрии и эксцессу.
          null_hypothesis: "Остатки имеют нормальное распределение"
          applicable_if: "n_observations >= 8"
          alpha: 0.05
          result_fields: ["statistic", "p_value", "status"]
          severity_if_failed: "warning"
        - id: "arch_lm"
          name: "Условная гетероскедастичность (ARCH-LM)"
          description: >-
            Проверяет наличие ARCH-эффектов в остатках. Тест неприменим
            при недостатке наблюдений или практически нулевой дисперсии.
          null_hypothesis: "Условная дисперсия остатков постоянна"
          applicable_if: "n_observations > arch_lags + 1 and residual variance > 0"
          lags: 10
          alpha: 0.05
          result_fields: ["statistic", "p_value", "status"]
          severity_if_failed: "warning"
        - id: "durbin_watson"
          name: "Статистика Дарбина-Уотсона (Durbin-Watson)"
          description: >-
            Оценивает серийную корреляцию остатков по статистике
            Durbin-Watson; p-value тест не вычисляется.
          null_hypothesis: "Нет серийной корреляции в остатках"
          applicable_if: "finite residuals with at least 2 observations"
          result_fields: ["statistic", "status"]
          severity_if_failed: "warning"

      regression_contract:
        runtime_module: "apps.api.routers.diagnostics"
        exact_test_ids: true
        applicable_if_required: true
        p_value_required_for: ["ljung_box", "jarque_bera", "arch_lm"]
        p_value_not_required_for: ["durbin_watson"]

    - id: "comparison"
      name: "Сравнение и ранжирование"
      order: 9
      description: "Ранжирование моделей по метрикам на validation-выборке."
      inputs:
        - "tuned_models"
        - "cv_scores"
        - "baseline_scores"
        - "diagnostic_reports"
      outputs:
        - "ranked_models"

    - id: "selection"
      name: "Выбор модели"
      order: 10
      description: "Финальный выбор модели или ансамбля."
      inputs:
        - "ranked_models"
        - "user_preferences"
      outputs:
        - "selected_model"

    - id: "model_card"
      name: "Model Card"
      order: 11
      description: "Формирование обязательного артефакта результата."
      inputs:
        - "selected_model"
      outputs:
        - "model_card"
