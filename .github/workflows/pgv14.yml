name: PGV14 page archives and every-page acceptance controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/pgv14/requirements.txt
      - run: python -m pytest scripts/pgv14/test_page_sets.py -v
      - run: python -m unittest tests.unit.test_pgv14_accept tests.unit.test_pgv13_accept -v
# DOM controls, renderer build and both typechecks also run in jest.yml.
# Chromium/UDS/OCR acceptance is explicit, isolated VM run + every-page review.
