name: AUTH-06 first-party transport
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scripts/auth06/requirements.txt
      - run: npx jest --ci --runInBand packages/ui/server/firstPartyProxy.test.ts packages/ui/lib/browserTransport.test.ts packages/ui/lib/authClient.test.ts packages/ui/lib/auth06SourceBoundary.test.ts packages/ui/components/LoginScreen.test.tsx packages/ui/context/AuthContext.test.tsx
      - run: python -m unittest discover -s tests/unit -p "test_auth06*.py" -v
      - run: python scripts/auth06/generate_proxy_routes.py --check
      - run: python scripts/auth00/inventory.py --check
      - run: npm run typecheck:all
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['16','18']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: auth06test
          POSTGRES_PASSWORD: auth06-ci-only
          POSTGRES_DB: auth06test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth06test -d auth06test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CISSTAT_AUTH_TEST_DSN: postgresql://auth06test:auth06-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/auth06test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scripts/auth06/requirements.txt
      - run: python scripts/auth06/verify_postgres.py
