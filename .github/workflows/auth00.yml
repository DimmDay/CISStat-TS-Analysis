name: AUTH-00 inventory

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inventory discovery and adversarial source fixtures
        run: python -m unittest discover -s tests/unit -p test_auth00_inventory.py -v
      - name: Source, classification and documentation parity
        run: python scripts/auth00/inventory.py --check
