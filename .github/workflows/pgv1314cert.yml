name: PGV13 PGV14 final certification controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/pgv1314cert/requirements.txt
      - run: python -m unittest tests.unit.test_pgv1314_certification tests.unit.test_pgv1314_ci -v
  local-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r apps/api/requirements.txt -r scripts/pgv1314cert/requirements.txt
      - run: npm ci --include=dev --workspaces --include-workspace-root --ignore-scripts --no-audit --no-fund
      - name: Full local CI procedure
        id: local
        env:
          PGV1314_LOCAL_OUT: ${{ runner.temp }}/pgv1314-local
        run: python scripts/pgv1314cert/cifix/verify_ci_local.py --out "$PGV1314_LOCAL_OUT"
      - uses: actions/upload-artifact@v6
        if: ${{ always() && steps.local.outcome != 'skipped' }}
        with:
          name: pgv1314-local-contracts-NOT-NATIVE-CERTIFICATE
          path: ${{ runner.temp }}/pgv1314-local
          if-no-files-found: error
