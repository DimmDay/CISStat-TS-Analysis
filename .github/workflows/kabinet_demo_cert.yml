name: AUTH-KABINET-DEMO Task1-7 certification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r scripts/kabinet_demo_cert/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/local_gates.py --only kabinet-demo-cert --skip-install
