name: AUTH-15 Campaign authority and isolated demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/auth15/requirements.txt
      - run: python -m unittest discover -s tests/unit -p "test_auth15*.py" -v
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: auth15test
          POSTGRES_PASSWORD: auth15-ci-only
          POSTGRES_DB: auth15test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth15test -d auth15test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CISSTAT_AUTH_TEST_DSN: postgresql://auth15test:auth15-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/auth15test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt -r scripts/auth15/requirements.txt
      - run: python scripts/auth15/verify_postgres.py
