name: AUTH-12 Atomic ledger and reservations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/auth12/requirements.txt
      - run: python -m unittest discover -s tests/unit -p "test_auth12*.py" -v
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: auth12test
          POSTGRES_PASSWORD: auth12-ci-only
          POSTGRES_DB: auth12test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth12test -d auth12test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CISSTAT_AUTH_TEST_DSN: postgresql://auth12test:auth12-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/auth12test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt -r scripts/auth12/requirements.txt
      - run: python scripts/auth12/verify_postgres.py
