# .github/workflows/test.yml
name: CISStat TS Analysis - Tests

on:
  push:
    branches: [ "develop", "refactor/*" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Основные зависимости проекта
        pip install -r requirements.txt -r requirements-dev.txt
        # Тестовые зависимости (pytest, syrupy для snapshot-тестов и т.д.)
        # Без этого шага шаг "Run tests" падал с "pytest: команда не найдена" (exit 127).
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      run: |
        # python -m pytest надёжнее, чем голый pytest: не зависит от PATH,
        # использует тот же интерпретатор, что и pip install выше.
        python -m pytest tests/ -v

