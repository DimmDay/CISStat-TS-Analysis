name: F-CERT-H1 storage warmup (AUTH-CERT-H1FIX)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/unit -p "test_warmup*.py" -v
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: warmuptest
          POSTGRES_PASSWORD: warmup-ci-only
          POSTGRES_DB: warmuptest
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U warmuptest -d warmuptest"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CISSTAT_AUTH_TEST_DSN: postgresql://warmuptest:warmup-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/warmuptest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/warmup/requirements.txt -r apps/api/requirements.txt
      - run: python scripts/warmup/verify_postgres.py
