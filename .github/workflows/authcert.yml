name: authcert

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AUTH-CERT browser-layer oracles (no DSN)
        run: python scripts/authcert/verify_browser.py

  native-postgres:
    strategy:
      matrix:
        pg: ["16", "18"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies
        run: |
          python -m pip install -r scripts/authcert/requirements.txt -r apps/api/requirements.txt
      - name: AUTH-CERT native end-to-end acceptance
        env:
          CISSTAT_AUTH_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python scripts/authcert/verify_postgres.py
