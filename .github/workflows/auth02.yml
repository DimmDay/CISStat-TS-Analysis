name: AUTH-02 durable storage
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/auth02/requirements.txt
      - run: python -m unittest discover -s tests/unit -p test_auth02_storage.py -v
  postgres:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: auth02test
          POSTGRES_PASSWORD: auth02-local-test
          POSTGRES_DB: auth02test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth02test -d auth02test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CISSTAT_AUTH_TEST_DSN: postgresql://auth02test:auth02-local-test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/auth02test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/auth02/requirements.txt
      - run: python scripts/auth02/verify_postgres.py
      - name: Expected-failure constraint oracles (four isolated mutants)
        run: python scripts/auth02/mutation_rehearsal.py
      - name: Seed restart probe
        run: python scripts/auth02/restart_probe.py seed --state "${{ runner.temp }}/auth02-restart.json"
      - name: Restart PostgreSQL service
        run: docker restart ${{ job.services.postgres.id }}
      - name: Verify durability after restart
        run: python scripts/auth02/restart_probe.py verify --state "${{ runner.temp }}/auth02-restart.json"
