name: AUTH-01 access contract

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contract tooling
        run: python -m pip install -r scripts/auth01/requirements.txt
      - name: Negative policy and OpenAPI tests
        run: python -m unittest discover -s tests/unit -p test_auth01_registry.py -v
      - name: Windows locale portability (CP1251 and CP1252)
        run: python scripts/auth01/windows_locale_check.py
      - name: Generated DTOs and AUTH-00 binding coverage
        run: python scripts/auth01/generate.py --check
