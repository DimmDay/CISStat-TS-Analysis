recommendation_rules:
  by_dq_score:
    high:
      - "arima"
      - "ets"
      - "prophet"
      - "tbats"
      - "xgboost"
      - "lstm"
      - "tft"
      - "nbeats"
    medium:
      - "arima"
      - "ets"
      - "prophet"
      - "xgboost"
      - "random_forest"
    low:
      - "naive"
      - "seasonal_naive"
      - "drift"
      - "ets"
      
  by_sample_size:
    tiny:
      models: ["naive", "drift"]
      message: "Недостаточно данных. Используйте наивный прогноз."
    small:
      models: ["ets", "arima", "theta"]
      message: "Мало данных. Используйте ETS, ARIMA или Theta."
    medium:
      models: ["arima", "prophet", "xgboost", "random_forest"]
      message: "Средний объём. Доступны статистические и ML-модели."
    large:
      models: ["xgboost", "lstm", "tft", "nbeats", "deepar"]
      message: "Большой объём. Рассмотрите Deep Learning."
      
  by_properties:
    stationary: ["arima", "ets", "garch"]
    non_stationary: ["prophet", "theta"]
    seasonal: ["ets", "prophet", "tbats", "tft"]
    white_noise: ["naive"]
    strong_trend: ["prophet", "theta"]
    volatile: ["garch"]
    multivariate: ["var", "deepar", "tft"]