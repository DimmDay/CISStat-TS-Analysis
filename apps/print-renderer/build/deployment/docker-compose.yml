services:
  print-renderer:
    image: cisstat-print-renderer:pgv08-fix
    build:
      context: ../../../..
      dockerfile: apps/print-renderer/build/Dockerfile
    network_mode: "none"
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    shm_size: 256m
    mem_limit: 2g
    pids_limit: 128
    environment:
      - CISSTAT_PRINT_RENDERER_HARD_TIMEOUT_S=60
      - CISSTAT_PRINT_RENDERER_MAX_CONCURRENT=2
      - CISSTAT_PRINT_RENDERER_TMP_DIR=/tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8907/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 10s
# No published ports: network none cannot expose HTTP on the host.
# Use docker compose exec (loopback inside the same container). PGV-09 defines IPC.
